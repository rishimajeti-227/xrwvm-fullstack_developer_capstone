<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up – Best Cars Dealership</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .register-card { max-width: 480px; margin: 60px auto; background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); padding: 40px; }
        .register-card h2 { color: #0f3460; font-weight: 700; }
        .btn-register { background: #0f3460; border: none; }
        .btn-register:hover { background: #16213e; }
    </style>
</head>
<body>

<div class="register-card">
    <div class="text-center mb-4">
        <h2>🚗 Create Account</h2>
        <p class="text-muted">Join Best Cars Dealership</p>
    </div>

    {% if message %}
    <div class="alert alert-danger">{{ message }}</div>
    {% endif %}

    <form method="post" action="{% url 'djangoapp:registration' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="username"><strong>Username</strong></label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="firstname"><strong>First Name</strong></label>
            <input type="text" class="form-control" id="firstname" name="firstname"
                   placeholder="Enter your first name" required>
        </div>

        <div class="form-group">
            <label for="lastname"><strong>Last Name</strong></label>
            <input type="text" class="form-control" id="lastname" name="lastname"
                   placeholder="Enter your last name" required>
        </div>

        <div class="form-group">
            <label for="email"><strong>Email</strong></label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
            <label for="psw"><strong>Password</strong></label>
            <input type="password" class="form-control" id="psw" name="psw"
                   placeholder="Create a password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-register mt-3">Register</button>
    </form>

    <p class="text-center mt-3 text-muted small">
        Already have an account? <a href="/djangoapp/">Login here</a>
    </p>
</div>

</body>
</html>

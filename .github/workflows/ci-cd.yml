name: CI/CD – Best Cars Capstone

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: Full Stack Cloud Development Capstone Project/server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint

      - name: Run flake8 linter
        working-directory: Full Stack Cloud Development Capstone Project/server
        run: |
          flake8 djangoapp/ --max-line-length=120 --exclude=migrations

      - name: Run Django system checks
        working-directory: Full Stack Cloud Development Capstone Project/server
        env:
          DJANGO_SETTINGS_MODULE: djangobackend.settings
        run: |
          python manage.py check

      - name: Run Django tests
        working-directory: Full Stack Cloud Development Capstone Project/server
        env:
          DJANGO_SETTINGS_MODULE: djangobackend.settings
        run: |
          python manage.py test djangoapp

name: Lint Python and JavaScript

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: "Full Stack Cloud Development Capstone Project/server"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Python files with flake8
        working-directory: "Full Stack Cloud Development Capstone Project/server"
        run: |
          flake8 djangoapp/ --max-line-length=120 --exclude=migrations

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JavaScript dependencies
        working-directory: "Full Stack Cloud Development Capstone Project/server/frontend"
        run: |
          npm install --legacy-peer-deps || true

      - name: Lint JavaScript files with ESLint
        working-directory: "Full Stack Cloud Development Capstone Project/server/frontend"
        run: |
          npx eslint src/ --ext .js,.jsx --max-warnings=50 || true
